<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中基礎文法總複習</title>
<style>
  :root{
    --teal:#0f766e; --teal-light:#ccfbf1; --teal-dark:#134e4a;
    --amber:#b45309; --bg:#f8fafc; --card:#ffffff; --ink:#1e293b; --sub:#64748b;
    --good:#16a34a; --bad:#dc2626; --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    color:#fff; padding:22px 16px 18px; text-align:center;
  }
  header h1{margin:0 0 4px; font-size:1.4rem;}
  header p{margin:0; font-size:.85rem; opacity:.9;}
  .tabs{
    display:flex; overflow-x:auto; gap:6px; padding:10px 10px 0; background:#fff;
    border-bottom:2px solid var(--border); position:sticky; top:0; z-index:10;
  }
  .tab{
    flex:0 0 auto; padding:8px 14px; border-radius:10px 10px 0 0; cursor:pointer;
    font-size:.85rem; white-space:nowrap; color:var(--sub); border:2px solid transparent;
    border-bottom:none; background:#f1f5f9;
  }
  .tab.active{ background:var(--teal-light); color:var(--teal-dark); font-weight:700; border-color:var(--border);}
  main{max-width:720px; margin:0 auto; padding:16px;}
  .phase-nav{display:flex; gap:8px; margin-bottom:16px;}
  .phase-btn{
    flex:1; padding:10px; border-radius:10px; border:2px solid var(--border);
    background:#fff; color:var(--sub); font-weight:700; cursor:pointer; font-size:.85rem;
  }
  .phase-btn.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card h3{margin:0 0 8px; color:var(--teal-dark); font-size:1.05rem;}
  .card p.zh{margin:0 0 10px; line-height:1.7; font-size:.95rem;}
  .ex{
    display:flex; align-items:flex-start; gap:8px; background:#f8fafc; border-radius:8px;
    padding:8px 10px; margin-bottom:6px;
  }
  .ex button{
    border:none; background:var(--teal-light); color:var(--teal-dark); border-radius:50%;
    width:28px; height:28px; flex:0 0 28px; cursor:pointer; font-size:.9rem;
  }
  .ex .en{font-weight:600;}
  .ex .zh-line{color:var(--sub); font-size:.85rem;}
  .progress{font-size:.8rem; color:var(--sub); text-align:center; margin-bottom:8px;}
  .q-card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px;}
  .q-text{font-size:1.05rem; font-weight:700; margin-bottom:14px;}
  .opt{
    display:block; width:100%; text-align:left; padding:10px 12px; margin-bottom:8px;
    border-radius:10px; border:2px solid var(--border); background:#fff; cursor:pointer; font-size:.95rem;
  }
  .opt.correct{border-color:var(--good); background:#f0fdf4; color:var(--good); font-weight:700;}
  .opt.wrong{border-color:var(--bad); background:#fef2f2; color:var(--bad); font-weight:700;}
  .explain{margin-top:10px; padding:10px; background:#f8fafc; border-radius:8px; font-size:.88rem; color:var(--sub); display:none;}
  .nextbtn{
    margin-top:14px; width:100%; padding:12px; border:none; border-radius:10px;
    background:var(--teal); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer;
  }
  .result{text-align:center; padding:30px 16px;}
  .result .score{font-size:2.4rem; font-weight:800; color:var(--teal-dark);}
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .match-item{
    padding:10px 8px; border-radius:10px; border:2px solid var(--border); background:#fff;
    cursor:pointer; font-size:.85rem; text-align:center; min-height:44px; display:flex; align-items:center; justify-content:center;
  }
  .match-item.selected{border-color:var(--teal); background:var(--teal-light);}
  .match-item.matched{border-color:var(--good); background:#f0fdf4; color:var(--good); opacity:.6; cursor:default;}
  .match-item.wrongflash{border-color:var(--bad); background:#fef2f2;}
  .restart{
    margin-top:16px; width:100%; padding:12px; border:none; border-radius:10px;
    background:var(--teal); color:#fff; font-weight:700; cursor:pointer;
  }
  footer{text-align:center; color:var(--sub); font-size:.78rem; padding:20px;}
</style>
</head>
<body>
<header>
  <h1>📘 高中基礎文法總複習</h1>
  <p>Learn 觀念 → MCQ 測驗 → Match 配對 · 點🔊可以聽發音</p>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer>資源班英文學習系統</footer>

<script>
// 高中基礎文法總複習 - 共用資料
// 供 HTML 互動練習系統 與 docx 講義產生腳本 共同使用

const GROUPS = [
  // ========== 1. be動詞 ==========
  {
    id: "beverb",
    name: "be動詞",
    icon: "🔹",
    learn: [
      {
        title: "be動詞是什麼？",
        zh: "be動詞（am / is / are / was / were）用來說明「主詞是什麼、在哪裡、怎麼樣」，後面常接名詞、形容詞、地點。中文常常翻成「是」，但『在』某地、『很』怎樣，也是用be動詞。",
        examples: [
          { en: "I am a student.", zh: "我是學生。" },
          { en: "She is happy.", zh: "她很開心。" },
          { en: "They are in the classroom.", zh: "他們在教室裡。" }
        ]
      },
      {
        title: "現在式：am / is / are",
        zh: "主詞是 I 用 am；主詞是 he/she/it 或單數名詞用 is；主詞是 you/we/they 或複數名詞用 are。",
        examples: [
          { en: "I am tired.", zh: "我累了。" },
          { en: "He is my brother.", zh: "他是我哥哥。" },
          { en: "We are ready.", zh: "我們準備好了。" }
        ]
      },
      {
        title: "過去式：was / were",
        zh: "was 對應 I / he / she / it（單數）；were 對應 you / we / they（複數）。",
        examples: [
          { en: "I was at home yesterday.", zh: "我昨天在家。" },
          { en: "They were happy last night.", zh: "他們昨晚很開心。" }
        ]
      },
      {
        title: "否定句與疑問句",
        zh: "否定句：be動詞 + not（is not = isn't，are not = aren't，was not = wasn't）。疑問句：把be動詞移到句首。",
        examples: [
          { en: "She is not (isn't) here.", zh: "她不在這裡。" },
          { en: "Are you a teacher?", zh: "你是老師嗎？" },
          { en: "Was he late?", zh: "他遲到了嗎？" }
        ]
      }
    ],
    mcq: [
      { q: "I ___ a student.", options: ["am", "is", "are", "be"], answer: 0, explain: "主詞是 I，一律用 am。" },
      { q: "She ___ very kind.", options: ["am", "is", "are", "were"], answer: 1, explain: "主詞是 she（單數第三人稱），用 is。" },
      { q: "We ___ classmates.", options: ["am", "is", "are", "was"], answer: 2, explain: "主詞是 we（複數），用 are。" },
      { q: "They ___ at the park last Sunday.", options: ["are", "is", "were", "am"], answer: 2, explain: "they 是複數，過去式用 were。" },
      { q: "___ you ready?", options: ["Am", "Is", "Are", "Be"], answer: 2, explain: "主詞是 you，疑問句把 are 移到句首。" },
      { q: "He ___ not at school yesterday.", options: ["is", "are", "was", "were"], answer: 2, explain: "he 是單數，過去式用 was，否定加 not。" },
      { q: "It ___ a rainy day.", options: ["am", "is", "are", "were"], answer: 1, explain: "it 是單數第三人稱，用 is。" },
      { q: "My parents ___ doctors.", options: ["is", "am", "are", "was"], answer: 2, explain: "my parents 是複數，用 are。" }
    ],
    match: [
      { term: "I", def: "am" },
      { term: "She / He / It", def: "is" },
      { term: "You / We / They", def: "are" },
      { term: "I / He / She / It（過去）", def: "was" },
      { term: "You / We / They（過去）", def: "were" },
      { term: "is not 縮寫", def: "isn't" },
      { term: "are not 縮寫", def: "aren't" },
      { term: "was not 縮寫", def: "wasn't" }
    ]
  },

  // ========== 2. do/does/did（一般動詞的助動詞） ==========
  {
    id: "dodoes",
    name: "do / does / did",
    icon: "🔹",
    learn: [
      {
        title: "一般動詞 vs be動詞",
        zh: "句子裡的動詞如果不是be動詞（am/is/are/was/were），就是「一般動詞」，例如 play、like、go、eat。一般動詞的否定句和疑問句要靠 do/does/did 幫忙，不能直接加 not 或移到句首。",
        examples: [
          { en: "I play basketball. (一般動詞)", zh: "我打籃球。" },
          { en: "I am a player. (be動詞)", zh: "我是球員。" }
        ]
      },
      {
        title: "現在式的 do / does",
        zh: "主詞是 I/you/we/they 用 do；主詞是 he/she/it 用 does。用了 does 之後，動詞要變回原形（去掉 -s/-es）。",
        examples: [
          { en: "Do you like coffee?", zh: "你喜歡咖啡嗎？" },
          { en: "Does she like coffee?", zh: "她喜歡咖啡嗎？" },
          { en: "He does not (doesn't) like tea.", zh: "他不喜歡茶。" }
        ]
      },
      {
        title: "過去式的 did",
        zh: "不管主詞是誰，過去式一律用 did，動詞也要變回原形（不能再加 -ed）。",
        examples: [
          { en: "Did you finish your homework?", zh: "你做完作業了嗎？" },
          { en: "I did not (didn't) go to school.", zh: "我沒有去上學。" }
        ]
      },
      {
        title: "常見錯誤提醒",
        zh: "❌ He is don't play games.（is 和 don't 不能同時用）→ ✅ He doesn't play games. be動詞句用be動詞否定，一般動詞句用 don't/doesn't/didn't 否定，兩種不可以混用！",
        examples: [
          { en: "✅ He doesn't play games.", zh: "他不玩遊戲。" },
          { en: "✅ He isn't playing games now.", zh: "他現在沒在玩遊戲。（現在進行式）" }
        ]
      }
    ],
    mcq: [
      { q: "___ you like pizza?", options: ["Do", "Does", "Did", "Are"], answer: 0, explain: "主詞 you 用 Do。" },
      { q: "___ she speak English?", options: ["Do", "Does", "Did", "Is"], answer: 1, explain: "主詞 she 用 Does。" },
      { q: "He ___ not like vegetables.", options: ["do", "does", "did", "is"], answer: 1, explain: "he 用 does not (doesn't)。" },
      { q: "They ___ not come yesterday.", options: ["do", "does", "did", "were"], answer: 2, explain: "過去式一律用 did。" },
      { q: "找出正確句子：", options: ["He is don't play games.", "He doesn't plays games.", "He doesn't play games.", "He not play games."], answer: 2, explain: "doesn't 後面動詞要變回原形 play，不能加 s，也不能跟 is 混用。" },
      { q: "___ they go to the party last night?", options: ["Do", "Does", "Did", "Were"], answer: 2, explain: "last night 表示過去，用 Did。" },
      { q: "I ___ not know the answer.", options: ["am", "do", "does", "is"], answer: 1, explain: "know 是一般動詞，主詞 I 用 do not (don't)。" },
      { q: "選出錯誤句子：", options: ["Does he like music?", "He does likes music.", "He doesn't like music.", "Did he like music?"], answer: 1, explain: "does 後面動詞要用原形 like，不可以加 s。" }
    ],
    match: [
      { term: "I / You / We / They（現在，疑問/否定）", def: "do" },
      { term: "He / She / It（現在，疑問/否定）", def: "does" },
      { term: "任何主詞（過去，疑問/否定）", def: "did" },
      { term: "do not 縮寫", def: "don't" },
      { term: "does not 縮寫", def: "doesn't" },
      { term: "did not 縮寫", def: "didn't" },
      { term: "does/did 後面的動詞形式", def: "原形動詞" },
      { term: "be動詞句的否定方式", def: "be動詞 + not" }
    ]
  },

  // ========== 3. to + V（不定詞） ==========
  {
    id: "toV",
    name: "to + 原形動詞",
    icon: "🔹",
    learn: [
      {
        title: "to + V 是什麼？",
        zh: "「to + 原形動詞」叫做不定詞，可以表示「去做某件事」或「目的」。to 後面一定要接動詞原形，不能加 s、ing、ed。",
        examples: [
          { en: "I want to eat pizza.", zh: "我想吃披薩。" },
          { en: "She decided to study abroad.", zh: "她決定去國外唸書。" }
        ]
      },
      {
        title: "常接 to V 的動詞",
        zh: "want to、need to、decide to、plan to、hope to、try to、like to、love to、forget to、learn to 後面都接 to + 原形動詞。",
        examples: [
          { en: "He needs to rest.", zh: "他需要休息。" },
          { en: "We plan to visit Taipei.", zh: "我們計劃去拜訪台北。" }
        ]
      },
      {
        title: "表示「目的」：為了要...",
        zh: "to + V 放在句尾，可以表示做某動作的目的，等於 in order to。",
        examples: [
          { en: "I get up early to catch the bus.", zh: "我早起是為了要趕公車。" },
          { en: "She studies hard to pass the exam.", zh: "她努力唸書是為了要通過考試。" }
        ]
      }
    ],
    mcq: [
      { q: "I want ___ a new phone.", options: ["buy", "to buy", "buying", "bought"], answer: 1, explain: "want 後面接 to + 原形動詞。" },
      { q: "She decided ___ home early.", options: ["go", "to go", "going", "goes"], answer: 1, explain: "decide 後面接 to + 原形動詞。" },
      { q: "He gets up early ___ breakfast.", options: ["make", "made", "to make", "making"], answer: 2, explain: "表示目的，用 to + 原形動詞。" },
      { q: "They plan ___ the movie tonight.", options: ["to watch", "watched", "watches", "watching"], answer: 0, explain: "plan 後面接 to + 原形動詞。" },
      { q: "找出正確句子：", options: ["I want to eating.", "I want to eats.", "I want to eat.", "I want eating."], answer: 2, explain: "to 後面一定接原形動詞 eat。" },
      { q: "She needs ___ more water.", options: ["drink", "drinks", "to drink", "drank"], answer: 2, explain: "need 後面接 to + 原形動詞。" },
      { q: "We study hard ___ good grades.", options: ["get", "to get", "getting", "got"], answer: 1, explain: "表示目的（為了得到好成績）。" }
    ],
    match: [
      { term: "want to", def: "想要做..." },
      { term: "need to", def: "需要做..." },
      { term: "decide to", def: "決定做..." },
      { term: "plan to", def: "計劃做..." },
      { term: "hope to", def: "希望做..." },
      { term: "try to", def: "嘗試做..." },
      { term: "forget to", def: "忘記做..." },
      { term: "to + V 表目的", def: "為了要..." }
    ]
  },

  // ========== 4. 現在簡單式 ==========
  {
    id: "presentsimple",
    name: "現在簡單式",
    icon: "🔹",
    learn: [
      {
        title: "什麼時候用現在簡單式？",
        zh: "用來說「習慣」「事實」「固定行程」。常搭配 always、usually、often、sometimes、every day、on Mondays 等時間副詞。",
        examples: [
          { en: "I get up at seven every day.", zh: "我每天七點起床。" },
          { en: "The sun rises in the east.", zh: "太陽從東邊升起。（事實）" }
        ]
      },
      {
        title: "動詞變化：第三人稱單數加 -s/-es",
        zh: "主詞是 he/she/it 時，動詞要加 s 或 es。一般加 s；字尾是 s, x, ch, sh, o 加 es；字尾是子音+y，去y加ies。",
        examples: [
          { en: "He plays basketball.", zh: "他打籃球。" },
          { en: "She watches TV.", zh: "她看電視。" },
          { en: "The baby cries a lot.", zh: "這個嬰兒常常哭。" }
        ]
      },
      {
        title: "否定與疑問",
        zh: "用 don't/doesn't + 原形動詞。",
        examples: [
          { en: "I don't like spicy food.", zh: "我不喜歡辣的食物。" },
          { en: "Does he go to school by bus?", zh: "他搭公車上學嗎？" }
        ]
      }
    ],
    mcq: [
      { q: "She ___ (watch) TV every night.", options: ["watch", "watches", "watching", "watched"], answer: 1, explain: "she 是第三人稱單數，watch 字尾加 es。" },
      { q: "The train ___ (leave) at 9 o'clock every day.", options: ["leave", "leaves", "leaving", "left"], answer: 1, explain: "固定行程用現在簡單式，第三人稱加 s。" },
      { q: "I ___ (not / like) coffee.", options: ["not like", "doesn't like", "don't like", "am not like"], answer: 2, explain: "主詞 I 用 don't + 原形。" },
      { q: "He ___ (study) every day.", options: ["study", "studys", "studies", "studied"], answer: 2, explain: "子音+y結尾，去y加ies。" },
      { q: "___ she speak French?", options: ["Do", "Does", "Did", "Is"], answer: 1, explain: "she 是第三人稱單數，疑問句用 Does。" },
      { q: "找出正確句子：", options: ["He go to school on foot.", "He goes to school on foot.", "He going to school on foot.", "He is go to school."], answer: 1, explain: "he 是第三人稱單數，go 要變 goes。" },
      { q: "選出信號詞會搭配現在簡單式：", options: ["yesterday", "last week", "usually", "two days ago"], answer: 2, explain: "usually（通常）是現在簡單式常見的時間副詞。" }
    ],
    match: [
      { term: "always", def: "總是" },
      { term: "usually", def: "通常" },
      { term: "often", def: "常常" },
      { term: "sometimes", def: "有時候" },
      { term: "every day", def: "每天" },
      { term: "第三人稱單數動詞變化", def: "加 s / es" },
      { term: "子音 + y 結尾動詞", def: "去y加ies" },
      { term: "現在簡單式的功能", def: "習慣、事實、固定行程" }
    ]
  },

  // ========== 5. 過去簡單式 ==========
  {
    id: "pastsimple",
    name: "過去簡單式",
    icon: "🔹",
    learn: [
      {
        title: "什麼時候用過去簡單式？",
        zh: "用來說「過去已經發生、已經結束」的動作，常搭配 yesterday、last night/week/year、...ago、in 2020 等表示過去的時間詞。",
        examples: [
          { en: "I watched a movie last night.", zh: "我昨晚看了一部電影。" },
          { en: "She visited Japan two years ago.", zh: "她兩年前去過日本。" }
        ]
      },
      {
        title: "規則動詞：加 -ed",
        zh: "一般動詞加 ed；字尾是 e 加 d；子音+y結尾去y加ied；重音在最後一個音節的短母音+子音要重複字尾子音再加ed。",
        examples: [
          { en: "play → played", zh: "" },
          { en: "like → liked", zh: "" },
          { en: "study → studied", zh: "" },
          { en: "stop → stopped", zh: "" }
        ]
      },
      {
        title: "不規則動詞：要背 V2",
        zh: "有些動詞過去式不是加ed，要單獨記憶，例如：go→went、eat→ate、see→saw、have→had、do→did、come→came、buy→bought。",
        examples: [
          { en: "I went to the park yesterday.", zh: "我昨天去了公園。" },
          { en: "We ate dinner together.", zh: "我們一起吃了晚餐。" }
        ]
      }
    ],
    mcq: [
      { q: "I ___ (go) to the zoo last Sunday.", options: ["go", "goes", "went", "going"], answer: 2, explain: "go 是不規則動詞，過去式是 went。" },
      { q: "She ___ (study) hard for the test yesterday.", options: ["study", "studys", "studied", "studying"], answer: 2, explain: "子音+y結尾，去y加ied。" },
      { q: "They ___ (play) soccer last weekend.", options: ["play", "plays", "played", "playing"], answer: 2, explain: "規則動詞加ed。" },

        zh: "un-：不（unhappy）；im- / in-：不（impossible, incorrect）；dis-：不、相反（disagree）；non-：非（nonsense）。im-通常用在字根開頭是m/p前面，in-用在其他情況。",
        examples: [
          { en: "happy → unhappy", zh: "不快樂的" },
          { en: "possible → impossible", zh: "不可能的" },
          { en: "correct → incorrect", zh: "不正確的" },
          { en: "agree → disagree", zh: "不同意" }
        ]
      },
      {
        title: "常見字首（Prefix）→ 方向、程度、其他",
        zh: "ex-：向外、之前的（export外銷, ex-wife前妻）；re-：再一次（rewrite重寫）；pre-：之前（preview預覽）；sub-：在...之下（subway地下鐵）；inter-：在...之間（international國際的）；trans-：跨越、轉換（transport運輸）；mis-：錯誤地（misunderstand誤解）。",
        examples: [
          { en: "port(攜帶) → export", zh: "出口、外銷" },
          { en: "write → rewrite", zh: "重寫" },
          { en: "view → preview", zh: "預覽" },
          { en: "understand → misunderstand", zh: "誤解" }
        ]
      }
    ],
    mcq: [
      { q: "teach + ___ = teacher（做...的人）", options: ["-er", "-tion", "-ful", "-ly"], answer: 0, explain: "-er表示「做...的人」。" },
      { q: "educate + ___ = education（動作的名詞）", options: ["-ness", "-tion", "-able", "-ive"], answer: 1, explain: "-tion把動詞變成名詞。" },
      { q: "help + ___ = helpful（充滿...的）", options: ["-less", "-ful", "-ous", "-al"], answer: 1, explain: "-ful表示「充滿...的」。" },
      { q: "help + ___ = helpless（沒有...的，與helpful相反）", options: ["-ful", "-less", "-ive", "-tion"], answer: 1, explain: "-less表示「沒有...的」，與-ful意思相反。" },
      { q: "danger + ___ = dangerous（危險的）", options: ["-ful", "-ous", "-able", "-tion"], answer: 1, explain: "-ous表示「具有...性質的」。" },
      { q: "quick + ___ = quickly（副詞）", options: ["-ness", "-ly", "-tion", "-ful"], answer: 1, explain: "-ly把形容詞變成副詞。" },
      { q: "un + happy = unhappy，un-的意思是？", options: ["再一次", "不、非", "之前", "跨越"], answer: 1, explain: "un-表示否定「不」。" },
      { q: "possible → impossible，im-的意思是？", options: ["不、非", "之間", "之下", "向外"], answer: 0, explain: "im-用在字根前是m/p時，表示否定「不」。" },
      { q: "re + write = rewrite，re-的意思是？", options: ["向外", "再一次", "在...之間", "跨越"], answer: 1, explain: "re-表示「再一次」。" },
      { q: "mis + understand = misunderstand，mis-的意思是？", options: ["正確地", "錯誤地", "之前", "之下"], answer: 1, explain: "mis-表示「錯誤地」。" },
      { q: "agree → disagree，dis-的意思是？", options: ["不、相反", "之間", "跨越", "之前"], answer: 0, explain: "dis-表示「不、相反」。" },
      { q: "inter + national = international，inter-的意思是？", options: ["之下", "之間", "向外", "跨越"], answer: 1, explain: "inter-表示「在...之間」。" }
    ],
    match: [
      { term: "-er / -or", def: "做...的人或物" },
      { term: "-tion / -sion", def: "動作或狀態的名詞" },
      { term: "-ful", def: "充滿...的" },
      { term: "-less", def: "沒有...的" },
      { term: "-able / -ible", def: "能夠...的" },
      { term: "-ous", def: "具有...性質的" },
      { term: "-ly", def: "（形容詞變副詞）...地" },
      { term: "un- / im- / in-", def: "不、非（否定）" },
      { term: "dis-", def: "不、相反" },
      { term: "re-", def: "再一次" },
      { term: "pre-", def: "之前" },
      { term: "mis-", def: "錯誤地" },
      { term: "inter-", def: "在...之間" },
      { term: "trans-", def: "跨越、轉換" }
    ]
  }
];

if (typeof module !== "undefined" && module.exports) {
  module.exports = GROUPS;
}

</script>
<script>
let currentGroupIdx = 0;
let currentPhase = "learn";
let mcqState = {};
let matchState = {};

function speak(text){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = GROUPS.map((g,i)=>
    `<div class="tab ${i===currentGroupIdx?'active':''}" onclick="selectGroup(${i})">${g.icon||''} ${g.name}</div>`
  ).join('');
}

function selectGroup(i){
  currentGroupIdx = i;
  currentPhase = "learn";
  render();
}

function selectPhase(p){
  currentPhase = p;
  render();
}

function render(){
  renderTabs();
  const g = GROUPS[currentGroupIdx];
  const main = document.getElementById('main');
  let html = `<div class="phase-nav">
    <button class="phase-btn ${currentPhase==='learn'?'active':''}" onclick="selectPhase('learn')">📖 Learn</button>
    <button class="phase-btn ${currentPhase==='mcq'?'active':''}" onclick="selectPhase('mcq')">✏️ MCQ</button>
    <button class="phase-btn ${currentPhase==='match'?'active':''}" onclick="selectPhase('match')">🔗 Match</button>
  </div>`;

  if(currentPhase==='learn'){
    html += renderLearn(g);
  } else if(currentPhase==='mcq'){
    html += renderMCQ(g);
  } else if(currentPhase==='match'){
    html += renderMatch(g);
  }
  main.innerHTML = html;

  if(currentPhase==='mcq') bindMCQ(g);
  if(currentPhase==='match') bindMatch(g);
}

function renderLearn(g){
  return g.learn.map(item=>{
    const exHtml = item.examples.map(ex=>`
      <div class="ex">
        <button onclick="speak(${JSON.stringify(ex.en)})">🔊</button>
        <div>
          <div class="en">${ex.en}</div>
          ${ex.zh ? `<div class="zh-line">${ex.zh}</div>` : ''}
        </div>
      </div>`).join('');
    return `<div class="card">
      <h3>${item.title}</h3>
      <p class="zh">${item.zh}</p>
      ${exHtml}
    </div>`;
  }).join('');
}

// ---------- MCQ ----------
function renderMCQ(g){
  if(!mcqState[g.id] || mcqState[g.id].restart){
    mcqState[g.id] = { idx:0, score:0, answered:false, order: shuffle([...Array(g.mcq.length).keys()]) };
  }
  const st = mcqState[g.id];
  if(st.idx >= g.mcq.length){
    return `<div class="result">
      <div>本組測驗完成！</div>
      <div class="score">${st.score} / ${g.mcq.length}</div>
      <button class="restart" onclick="restartMCQ('${g.id}')">🔄 重新測驗</button>
    </div>`;
  }
  const qIdx = st.order[st.idx];
  const q = g.mcq[qIdx];
  const optOrder = st.currentOptOrder || (st.currentOptOrder = shuffle([...Array(q.options.length).keys()]));
  const optsHtml = optOrder.map(oi=>`<button class="opt" data-oi="${oi}">${q.options[oi]}</button>`).join('');
  return `<div class="progress">第 ${st.idx+1} / ${g.mcq.length} 題　　得分：${st.score}</div>
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      <div id="opts">${optsHtml}</div>
      <div class="explain" id="explainBox">${q.explain}</div>
      <button class="nextbtn" id="nextBtn" style="display:none;" onclick="nextMCQ('${g.id}')">下一題 →</button>
    </div>`;
}

function bindMCQ(g){
  const st = mcqState[g.id];
  if(st.idx >= g.mcq.length) return;
  const qIdx = st.order[st.idx];
  const q = g.mcq[qIdx];
  document.querySelectorAll('#opts .opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(st.answered) return;
      st.answered = true;
      const chosen = parseInt(btn.dataset.oi);
      document.querySelectorAll('#opts .opt').forEach(b=>{
        const oi = parseInt(b.dataset.oi);
        if(oi === q.answer) b.classList.add('correct');
        else if(oi === chosen) b.classList.add('wrong');
        b.style.pointerEvents='none';
      });
      if(chosen === q.answer) st.score++;
      document.getElementById('explainBox').style.display='block';
      document.getElementById('nextBtn').style.display='block';
    };
  });
}

function nextMCQ(gid){
  const st = mcqState[gid];
  st.idx++;
  st.answered = false;
  st.currentOptOrder = null;
  render();
}

function restartMCQ(gid){
  mcqState[gid] = { restart:true };
  render();
}

// ---------- Match ----------
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderMatch(g){
  if(!matchState[g.id] || matchState[g.id].restart){
    const pairs = g.match.map((p,i)=>({...p, pid:i}));
    // pick up to 8 pairs per round for manageable board
    const roundPairs = pairs.length > 8 ? shuffle(pairs).slice(0,8) : pairs;
    matchState[g.id] = {
      pairs: roundPairs,
      leftOrder: shuffle(roundPairs.map(p=>p.pid)),
      rightOrder: shuffle(roundPairs.map(p=>p.pid)),
      selectedLeft: null, selectedRight: null,
      matched: new Set(),
    };
  }
  const st = matchState[g.id];
  const total = st.pairs.length;
  if(st.matched.size === total){
    return `<div class="result">
      <div>🎉 全部配對完成！</div>
      <div class="score">${total} / ${total}</div>
      <button class="restart" onclick="restartMatch('${g.id}')">🔄 重新配對（換一組）</button>
    </div>`;
  }
  const byId = {};
  st.pairs.forEach(p=>byId[p.pid]=p);
  const leftHtml = st.leftOrder.map(pid=>{
    const matched = st.matched.has(pid);
    const selected = st.selectedLeft===pid;
    return `<div class="match-item ${matched?'matched':''} ${selected?'selected':''}" data-side="left" data-pid="${pid}">${byId[pid].term}</div>`;
  }).join('');
  const rightHtml = st.rightOrder.map(pid=>{
    const matched = st.matched.has(pid);
    const selected = st.selectedRight===pid;
    return `<div class="match-item ${matched?'matched':''} ${selected?'selected':''}" data-side="right" data-pid="${pid}">${byId[pid].def}</div>`;
  }).join('');
  return `<div class="progress">已配對 ${st.matched.size} / ${total}</div>
    <div class="match-grid">${leftHtml}${rightHtml}</div>`;
}

function bindMatch(g){
  const st = matchState[g.id];
  document.querySelectorAll('.match-item').forEach(el=>{
    if(el.classList.contains('matched')) return;
    el.onclick = ()=>{
      const side = el.dataset.side;
      const pid = parseInt(el.dataset.pid);
      if(side==='left') st.selectedLeft = (st.selectedLeft===pid) ? null : pid;
      else st.selectedRight = (st.selectedRight===pid) ? null : pid;
      if(st.selectedLeft!==null && st.selectedRight!==null){
        if(st.selectedLeft === st.selectedRight){
          st.matched.add(st.selectedLeft);
          st.selectedLeft = null; st.selectedRight = null;
          render();
        } else {
          render();
          setTimeout(()=>{
            st.selectedLeft = null; st.selectedRight = null;
            render();
          }, 500);
        }
      } else {
        render();
      }
    };
  });
}

function restartMatch(gid){
  matchState[gid] = { restart:true };
  render();
}

render();
</script>
</body>
</html>
