<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>G11 L4 Day of the Dead 練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered column for tablets; papel-picado strip on top, tabbed sections (文法→片語→單字→錯題本), one question per card. */
:root{
  --bg:#F6F4F8; --surface:#FFFFFF; --ink:#241B30; --muted:#6B6177; --line:#E3DDEA;
  --marigold:#C76E00; --marigold-ink:#8F4E00; --marigold-bg:#FCE9C8;
  --rose:#B03468; --rose-bg:#F8DDE8; --violet:#5B3F8C;
  --good:#1F7A4D; --good-bg:#DDF2E6; --bad:#B42318; --bad-bg:#FBE1DE;
  --shadow:0 1px 2px rgba(36,27,48,.06),0 4px 14px rgba(36,27,48,.06);
  --f-ui:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-word:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121E; --surface:#221B2C; --ink:#F1ECF6; --muted:#AFA4BC; --line:#3A3046;
  --marigold:#F2A33A; --marigold-ink:#F5B65E; --marigold-bg:#3D2A12;
  --rose:#F07AA8; --rose-bg:#40192A; --violet:#B9A0E6;
  --good:#6FD3A0; --good-bg:#173326; --bad:#FF8A80; --bad-bg:#3F1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121E; --surface:#221B2C; --ink:#F1ECF6; --muted:#AFA4BC; --line:#3A3046;
  --marigold:#F2A33A; --marigold-ink:#F5B65E; --marigold-bg:#3D2A12;
  --rose:#F07AA8; --rose-bg:#40192A; --violet:#B9A0E6;
  --good:#6FD3A0; --good-bg:#173326; --bad:#FF8A80; --bad-bg:#3F1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* papel picado */
.picado{display:flex;gap:6px;justify-content:center;margin:0 auto;padding-top:4px;max-width:820px;overflow:hidden}
.flag{flex:0 0 46px;height:40px;clip-path:polygon(0 0,100% 0,100% 78%,88% 100%,75% 78%,62% 100%,50% 78%,38% 100%,25% 78%,12% 100%,0 78%);
  background:radial-gradient(circle at 50% 40%,var(--bg) 0 5px,transparent 6px),
             radial-gradient(circle at 25% 22%,var(--bg) 0 3px,transparent 4px),
             radial-gradient(circle at 75% 22%,var(--bg) 0 3px,transparent 4px),var(--c)}
.flag:nth-child(4n+1){--c:var(--marigold)} .flag:nth-child(4n+2){--c:var(--rose)}
.flag:nth-child(4n+3){--c:var(--violet)} .flag:nth-child(4n+4){--c:var(--good)}

header.top{padding:14px 0 8px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-word);font-size:clamp(26px,5vw,36px);line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0}

nav.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--marigold)}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--rose-bg);color:var(--rose);font-size:13px;margin-left:4px;text-align:center}

.steps{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--marigold-bg);border-color:var(--marigold);color:var(--marigold-ink);font-weight:700}
.row-label{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.formula{background:var(--marigold-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;margin:10px 0}
.card h3{margin:0;font-size:19px}
.card ul{margin:8px 0 0;padding-left:22px}
.ex{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.ex .en{font-family:var(--f-word);font-style:italic}
.ex .zh{color:var(--muted);font-size:15px}
mark{background:var(--rose-bg);color:var(--rose);padding:0 3px;border-radius:4px;font-style:normal;font-weight:700}

.say{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0}
.say svg{width:18px;height:18px;fill:none;stroke:var(--marigold-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--marigold);transition:width .3s}
.prompt{font-size:20px;line-height:1.55;margin:0 0 4px;display:flex;gap:10px;align-items:flex-start}
.prompt .big{font-family:var(--f-word);font-size:34px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;min-height:52px;display:flex;gap:12px;align-items:center}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--marigold)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .k{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block}
.fb span{color:var(--ink)}
.hint{margin-top:12px;padding:10px 14px;border-left:4px solid var(--violet);background:var(--bg);border-radius:0 8px 8px 0;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--marigold);color:#fff}
:root[data-theme="dark"] .btn{color:#1d130a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#1d130a}}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

.done{text-align:center}
.score{font-family:var(--f-word);font-size:56px;font-weight:700;color:var(--marigold-ink);font-variant-numeric:tabular-nums;line-height:1.1}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:56px;text-align:center;overflow-wrap:anywhere}
.tile.en{font-family:var(--f-word);font-weight:700;font-size:18px}
.tile.sel{border-color:var(--marigold);background:var(--marigold-bg)}
.tile.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);cursor:default}
.tile.no{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.flip{position:relative;min-height:170px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .w{font-family:var(--f-word);font-size:26px;font-weight:700}
.flip .pos{font-size:14px;color:var(--muted)}
.flip .back{display:none}
.flip.open{background:var(--marigold-bg);border-color:var(--marigold)}
.flip.open .back{display:block}
.flip.open .tap{display:none}
.flip .tap{margin-top:auto;font-size:13px;color:var(--muted)}
.flip .say{position:absolute;top:12px;right:12px}
.back .zh{font-weight:700;font-size:18px}
.back .exs{font-family:var(--f-word);font-style:italic;font-size:15px;margin-top:4px}
.back .exz{font-size:14px;color:var(--muted)}

/* tiles (sentence building) */
.zone{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zone.pool{border-style:solid;background:var(--bg)}
.wtile{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-family:var(--f-word);font-size:18px}
.wtile.hl{border-color:var(--violet);box-shadow:0 0 0 3px var(--rose-bg)}
.zone.ok{border-color:var(--good);background:var(--good-bg)}

/* spelling */
.spell-in{width:100%;font:inherit;font-size:22px;font-family:var(--f-word);padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:14px}
.letters{font-family:var(--f-word);font-size:26px;letter-spacing:.18em;color:var(--marigold-ink);font-weight:700}

/* wrong book */
.wlist{display:grid;gap:8px;margin-top:12px}
.witem{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.witem .t{min-width:0;overflow-wrap:anywhere}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--rose-bg);color:var(--rose);white-space:nowrap;align-self:flex-start}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}

@media (max-width:480px){body{font-size:16px}.prompt{font-size:18px}.prompt .big{font-size:28px}.card{padding:16px}.tile.en{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="picado" aria-hidden="true" id="picado"></div>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">G11 English · Lesson 4</div>
    <h1>Day of the Dead 練習</h1>
    <p class="sub">先練文法，再練片語和單字。答錯的題目會自動收進錯題本。</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>

<script>
/* ===================== 資料 DATA ===================== */
const DATA = {
  grammar: [
    {
      id: 1,
      title: '句型一　be thought / said / believed + to VR / to have p.p.',
      short: '句型一 be said to',
      formula: 'S + be + thought / said / believed + to VR（同時）／ to have p.p.（更早）',
      rules: [
        '意思是「一般認為……；據說……；人們相信……」。',
        '跟「認為、據說」<mark>同時</mark>發生 → <b>to VR</b>',
        '比「認為、據說」<mark>更早</mark>發生 → <b>to have p.p.</b>',
        '改寫：It is said that + S + V ＝ S + is said + to VR',
      ],
      examples: [
        ['The souls of the dead are believed to return to earth.', '人們相信亡者的靈魂會回到人間。（課文）'],
        ['The Day of the Dead is thought to have originated centuries ago.', '一般認為亡靈節源自幾百年前。（課文）'],
      ],
      mcq: [
        { q: 'This old lady is believed ______ one of the richest women in town now.', a: 'to be', d: ['to have been', 'be', 'is'],
          hint: '看句尾的 now：是現在的事，還是更早的事？', ex: 'now 表示和「被相信」同時 → to be。' },
        { q: 'This temple ______ the oldest in Taiwan.', a: 'is believed to be', d: ['is believed that', 'believes that is', 'believes to be'],
          hint: '主詞是寺廟，寺廟自己會「相信」嗎？', ex: '寺廟是「被相信」，用 be believed + to VR。' },
        { q: 'The Day of the Dead is thought ______ centuries ago.', a: 'to have originated', d: ['originate', 'to originate', 'originated'],
          hint: 'centuries ago 比「現在大家認為」早還是晚？', ex: 'centuries ago 比現在更早 → to have p.p.' },
        { q: 'Steve is said ______ to Tainan last Thursday.', a: 'to have moved', d: ['moving', 'to move', 'moved'],
          hint: 'last Thursday 是已經發生的事。', ex: '搬家發生在「據說」之前 → to have moved。' },
        { q: 'Chocolate is said ______ good for your mood.', a: 'to be', d: ['to have been', 'being', 'is'],
          hint: '巧克力讓人心情好，是一直都這樣，還是以前才這樣？', ex: '一般事實，和「據說」同時 → to be。' },
        { q: 'The thief is believed ______ the country last night.', a: 'to have left', d: ['to leave', 'leaving', 'left'],
          hint: '找找看句子裡表示過去的時間。', ex: 'last night 已經發生 → to have left。' },
        { q: 'It is said that the castle is empty. = The castle ______ empty.', a: 'is said to be', d: ['is said that', 'says to be', 'is said being'],
          hint: '改寫時主詞換成 the castle，後面接 to 加什麼？', ex: 'It is said that S + V → S + is said + to VR。' },
        { q: 'Cats are thought ______ nine lives.', a: 'to have', d: ['to have had', 'having', 'has'],
          hint: '這裡的 have 是「擁有」。貓是現在就有九條命嗎？', ex: '「擁有九條命」和「認為」同時 → to have（原形 have）。' },
      ],
    },
    {
      id: 2,
      title: '句型二　would rather … than …',
      short: '句型二 would rather',
      formula: 'S + would rather + VR + than + VR　＝　S + would + VR + rather than + VR',
      rules: [
        '意思是「寧可……也不要……」：前面是<mark>想做的</mark>，than 後面是<mark>不想做的</mark>。',
        '兩邊動詞都用<b>原形 VR</b>：不加 to、不加 -ing。',
        'would rather 可縮寫成 <b>’d rather</b>，例如 I’d rather…',
      ],
      examples: [
        ['Mexicans would rather embrace death than ignore it.', '墨西哥人寧可擁抱死亡，也不要忽視它。（課文）'],
        ['I would rather stay home than go to the party.', '我寧可待在家，也不要去派對。'],
      ],
      mcq: [
        { q: 'Jason would rather ______ the blame than ______ that he is innocent.', a: 'take; argue', d: ['taking; arguing', 'to take; to argue', 'takes; argues'],
          hint: 'would rather 和 than 後面的動詞，要長什麼樣子？', ex: '兩邊都用原形：take; argue。' },
        { q: 'Sam ______ quit ______ keep working in this company.', a: 'would rather; than', d: ['would; than', 'would rather; prefer to', 'would prefer to; rather'],
          hint: '「寧可……也不要……」的固定搭配是哪兩個字？', ex: 'would rather … than … 是固定搭配。' },
        { q: 'I would rather stay home ______ go to the party.', a: 'than', d: ['to', 'then', 'and'],
          hint: '有一個選項跟答案只差一個字母。', ex: 'than 是「比」，then 是「然後」。' },
        { q: 'Mexicans would rather ______ death than ignore it.', a: 'embrace', d: ['embracing', 'to embrace', 'embraced'],
          hint: '看看 than 後面的 ignore 是什麼形式。', ex: '兩邊形式一樣，都用原形：embrace / ignore。' },
        { q: 'I’d rather walk ______ take a crowded bus.', a: 'than', d: ['then', 'that', 'to'],
          hint: '這句在比較「走路」和「搭公車」。', ex: '比較用 than。' },
        { q: 'She would rather ______ at home than go out tonight.', a: 'stay', d: ['staying', 'to stay', 'stays'],
          hint: 'would 是助動詞，助動詞後面接什麼？', ex: 'would rather + 原形 → stay。' },
        { q: 'The kids would play games rather than ______ homework.', a: 'do', d: ['doing', 'to do', 'did'],
          hint: 'rather than 前面的動詞是 play，是什麼形式？', ex: 'rather than 兩邊形式一樣：play / do。' },
        { q: 'In “I’d rather go now,” the ’d means ______.', a: 'would', d: ['had', 'did', 'should'],
          hint: '後面接的是 rather。', ex: '’d rather ＝ would rather。' },
      ],
    },
  ],
  sentences: [
    { zh: '大家相信 Tom 能通過考試。', en: 'Tom is believed to be able to pass the test.' },
    { zh: '一般認為亡靈節源自阿茲特克人。', en: 'The Day of the Dead is thought to have originated with the Aztecs.' },
    { zh: '人們相信亡者的靈魂會回到人間。', en: 'The souls of the dead are believed to return to earth.' },
    { zh: '據說 Steve 上週四已經搬到台南了。', en: 'Steve is said to have moved to Tainan last Thursday.' },
    { zh: '墨西哥人寧可擁抱死亡，也不要忽視它。', en: 'Mexicans would rather embrace death than ignore it.' },
    { zh: '很多人寧願抱怨，也不願解決問題。', en: 'Many people would rather complain than solve the problem.' },
    { zh: '我寧可待在家，也不要去派對。', en: 'I would rather stay home than go to the party.' },
  ],
  phrases: [
    { p: 'scare … to death', zh: '把……嚇得要命', note: '誇飾用法。to 是介系詞，後面接名詞 death。', ex: 'When Daniel jumped out and shouted my name, it scared me to death.', exZh: 'Daniel 突然跳出來大叫我的名字，把我嚇得要命。' },
    { p: 'make one’s hair stand on end', zh: '使人毛骨悚然', note: '形容嚇到頭髮都豎起來。make 後面接原形 stand。', ex: 'The ghost story made my hair stand on end.', exZh: '那個鬼故事讓我毛骨悚然。' },
    { p: 'in honor of', zh: '紀念；向……致敬', note: '表示目的。類似片語：in memory of。', ex: 'A concert was held in honor of those killed in the war.', exZh: '舉辦了一場音樂會，紀念在戰爭中喪生的人。' },
    { p: 'in advance', zh: '事先；提前', note: '常放句尾表「事先」；in advance of + N 表「在……之前」。', ex: 'Jason paid his rent in advance.', exZh: 'Jason 提前付了房租。' },
    { p: 'die out', zh: '逐漸消失；滅絕', note: '不及物，後面不接受詞。', ex: 'The custom of sending paper cards is dying out.', exZh: '寄紙卡片的習俗正逐漸消失。' },
  ],
  // pid = 對應的片語（0–4），用來挑選干擾選項
  phraseQs: [
    { pid: 4, q: 'The custom of sending paper cards is ______.', a: 'dying out', zh: '寄紙本卡片的習俗正在逐漸消失。' },
    { pid: 0, q: 'Stop telling ghost stories! You are ______.', a: 'scaring me to death', zh: '別再講鬼故事了！你快把我嚇死了。' },
    { pid: 3, q: 'Make an appointment ______ before you see the dentist.', a: 'in advance', zh: '看牙醫前務必事先預約。' },
    { pid: 1, q: 'The strange noise at midnight ______.', a: 'made my hair stand on end', zh: '半夜奇怪的聲音讓我毛骨悚然。' },
    { pid: 2, q: 'The concert was held ______ those killed in the war.', a: 'in honor of', zh: '這場音樂會是為了紀念戰爭中喪生的人。' },
    { pid: 4, q: 'Some languages are ______ because young people don’t speak them.', a: 'dying out', zh: '有些語言正在消失，因為年輕人不說了。' },
    { pid: 3, q: 'Please buy your concert tickets ______.', a: 'in advance', zh: '請事先購買演唱會門票。' },
    { pid: 2, q: 'A statue was built ______ the famous writer.', a: 'in honor of', zh: '為了紀念這位知名作家，蓋了一座雕像。' },
  ],
  // [單字, 詞性, 中文, 例句, 例句中譯, 例句中出現的字形]

/* ===================== 工具 ===================== */
const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (arr, n) => shuffle(arr).slice(0, n);
const LETTERS = 'ABCD';

const store = {
  get(k, d) { try { const v = localStorage.getItem('g11l4_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('g11l4_' + k, JSON.stringify(v)); } catch (e) {} },
};
let wrong = new Set(store.get('wrong', []));
const saveWrong = () => { store.set('wrong', [...wrong]); updateBadge(); };
const addWrong = (k) => { if (k) { wrong.add(k); saveWrong(); } };
const removeWrong = (k) => { if (k && wrong.delete(k)) saveWrong(); };

const SPEAK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function speak(text) {
  try {
    const synth = window.speechSynthesis; if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ' '));
    u.lang = 'en-US'; u.rate = 0.85;
    const v = synth.getVoices().find(v => /^en[-_]US/i.test(v.lang)); if (v) u.voice = v;
    synth.speak(u);
  } catch (e) {}
}
const sayBtn = (text, label = '朗讀') => `<button class="say" type="button" data-say="${esc(text)}" aria-label="${label}">${SPEAK_SVG}</button>`;
document.addEventListener('click', (e) => { const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); speak(b.dataset.say); } });

/* ===================== 題目產生 ===================== */
function grammarQ(set, i) {
  const g = DATA.grammar[set], it = g.mcq[i];
  return { key: `g${set}-${i}`, tag: g.short, prompt: esc(it.q), options: shuffle([it.a, ...it.d]), answer: it.a, hint: it.hint, explain: it.ex };
}
function phraseQ(i) {
  const it = DATA.phraseQs[i];
  const others = DATA.phraseQs.filter(x => x.pid !== it.pid);
  const seen = new Set(); const ds = [];
  for (const x of shuffle(others)) { if (!seen.has(x.pid)) { seen.add(x.pid); ds.push(x.a); } if (ds.length === 3) break; }
  return { key: `p-${i}`, tag: '片語', prompt: `${esc(it.q)}<div class="muted" style="font-size:15px">${esc(it.zh)}</div>`,
    options: shuffle([it.a, ...ds]), answer: it.a, hint: '先看中文，找出關鍵意思。', explain: `答案：${it.a}` };
}
function distractors(i, n, field) {
  const pos = DATA.vocab[i][1][0];
  const same = DATA.vocab.map((v, j) => j).filter(j => j !== i && DATA.vocab[j][1][0] === pos);
  const rest = DATA.vocab.map((v, j) => j).filter(j => j !== i && !same.includes(j));
  return [...pick(same, n), ...pick(rest, n)].slice(0, n).map(j => DATA.vocab[j][field]);
}
function vocabQ(i, type) {
  const [w, pos, zh, ex, exZh, form] = DATA.vocab[i];
  const base = { key: `v-${i}`, tag: '單字' };
  if (type === 'en') return { ...base, prompt: `<span class="big">${w}</span>`, speak: w, options: shuffle([zh, ...distractors(i, 3, 2)]), answer: zh,
    hint: `詞性是 ${pos}`, explain: `${w}（${pos}）${zh}` };
  if (type === 'zh') return { ...base, prompt: `「${zh}」<span class="muted">（${pos}）</span>`, options: shuffle([w, ...distractors(i, 3, 0)]), answer: w,
    hint: `開頭字母是 ${w[0]}`, explain: `${zh} ＝ ${w}` };
  const blanked = esc(ex).replace(form, '______');
  return { ...base, prompt: `${blanked}<div class="muted" style="font-size:15px">${esc(exZh)}</div>`, options: shuffle([form, ...distractors(i, 3, 5)]), answer: form,
    hint: `答案的意思是「${zh}」`, explain: `${ex}` };
}
function qFromKey(k) {
  let m;
  if ((m = k.match(/^g(\d)-(\d+)$/))) return grammarQ(+m[1], +m[2]);
  if ((m = k.match(/^p-(\d+)$/))) return phraseQ(+m[1]);
  if ((m = k.match(/^v-(\d+)$/))) return vocabQ(+m[1], ['en', 'zh', 'cloze'][Math.floor(Math.random() * 3)]);
  return null;
}

/* ===================== 選擇題引擎 ===================== */
function runQuiz(root, build, opts = {}) {
  let qs = build(), idx = 0, score = 0, missed = [];
  const render = () => {
    if (idx >= qs.length) return finish();
    const q = qs[idx];
    root.innerHTML = '';
    const card = h(`<div class="card">
      <div class="qhead"><span>${esc(q.tag || '')}</span><span>第 ${idx + 1} / ${qs.length} 題　答對 ${score}</span></div>
      <div class="bar"><i style="width:${(idx / qs.length) * 100}%"></i></div>
      <div class="prompt"><div style="min-width:0">${q.prompt}</div>${q.speak ? sayBtn(q.speak) : ''}</div>
      <div class="opts">${q.options.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="slot"></div>
      <div class="actions">${q.hint ? '<button class="btn ghost" type="button" data-act="hint">看提示</button>' : ''}<button class="btn" type="button" data-act="next" hidden>下一題</button></div>
    </div>`);
    root.append(card);
    const slot = $('.slot', card), next = $('[data-act="next"]', card), hintB = $('[data-act="hint"]', card);
    if (hintB) hintB.onclick = () => { if (!$('.hint', slot)) slot.prepend(h(`<div class="hint">${esc(q.hint)}</div>`)); hintB.hidden = true; };
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const chosen = q.options[+b.dataset.i], ok = chosen === q.answer;
      card.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.options[+x.dataset.i] === q.answer) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
      if (ok) { score++; if (opts.review) removeWrong(q.key); }
      else { addWrong(q.key); missed.push(q); }
      slot.append(h(`<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '答對了！' : '再想想看。'}</b><span>${esc(q.explain || '')}</span></div>`));
      if (hintB) hintB.hidden = true;
      next.hidden = false; next.textContent = idx + 1 < qs.length ? '下一題' : '看結果'; next.focus();
    });
    next.onclick = () => { idx++; render(); };
  };
  const finish = () => {
    const pct = Math.round(score / qs.length * 100);
    if (opts.id) { const best = store.get('best', {}); if (!best[opts.id] || pct > best[opts.id]) { best[opts.id] = pct; store.set('best', best); } }
    root.innerHTML = '';
    const card = h(`<div class="card done">
      <div class="muted">這一回答對</div>
      <div class="score">${score} / ${qs.length}</div>
      <p>${pct === 100 ? '全部答對，可以換下一個練習了。' : pct >= 70 ? '大部分都會了，錯的再練一次。' : '先回去看重點，再試一次。'}</p>
      <div class="actions" style="justify-content:center">
        ${missed.length ? '<button class="btn" type="button" data-act="miss">只練錯的</button>' : ''}
        <button class="btn ghost" type="button" data-act="again">再做一次</button>
      </div></div>`);
    root.append(card);
    const m = $('[data-act="miss"]', card);
    if (m) m.onclick = () => { const again = missed.map(q => ({ ...q, options: shuffle(q.options) })); qs = again; idx = 0; score = 0; missed = []; render(); };
    $('[data-act="again"]', card).onclick = () => { qs = build(); idx = 0; score = 0; missed = []; render(); };
  };
  render();
}

/* ===================== 配對引擎 ===================== */
function runMatch(root, buildPairs, size = 5) {
  let rounds = [], r = 0, mistakes = 0;
  const start = () => { const all = shuffle(buildPairs()); rounds = []; for (let i = 0; i < all.length; i += size) rounds.push(all.slice(i, i + size)); r = 0; mistakes = 0; render(); };
  const render = () => {
    if (r >= rounds.length) return finish();
    const pairs = rounds[r], rights = shuffle(pairs);
    root.innerHTML = '';
    const card = h(`<div class="card">
      <div class="qhead"><span>點左邊，再點右邊的對應意思</span><span>第 ${r + 1} / ${rounds.length} 組</span></div>
      <div class="bar"><i style="width:${(r / rounds.length) * 100}%"></i></div>
      <div class="match"><div class="col L"></div><div class="col R"></div></div></div>`);
    root.append(card);
    let sel = null, left = pairs.length;
    pairs.forEach((p, i) => { const b = h(`<button class="tile en" type="button">${esc(p.l)}</button>`); b.dataset.i = i; $('.L', card).append(b); });
    rights.forEach(p => { const b = h(`<button class="tile" type="button">${esc(p.r)}</button>`); b.dataset.i = pairs.indexOf(p); $('.R', card).append(b); });
    $('.L', card).onclick = (e) => { const b = e.target.closest('.tile'); if (!b || b.classList.contains('ok')) return;
      card.querySelectorAll('.L .tile').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; if (pairs[+b.dataset.i].speak) speak(pairs[+b.dataset.i].speak); };
    $('.R', card).onclick = (e) => { const b = e.target.closest('.tile'); if (!b || b.classList.contains('ok') || !sel) return;
      if (b.dataset.i === sel.dataset.i) { b.classList.add('ok'); sel.classList.add('ok'); sel.classList.remove('sel'); b.disabled = sel.disabled = true; sel = null;
        if (--left === 0) { r++; setTimeout(render, 450); } }
      else { mistakes++; addWrong(pairs[+sel.dataset.i].key); [b, sel].forEach(x => { x.classList.remove('no'); void x.offsetWidth; x.classList.add('no'); }); } };
  };
  const finish = () => {
    root.innerHTML = '';
    const card = h(`<div class="card done"><div class="muted">配對完成，配錯</div><div class="score">${mistakes} 次</div>
      <p>${mistakes === 0 ? '一次都沒配錯！' : '配錯的字已經收進錯題本。'}</p>
      <div class="actions" style="justify-content:center"><button class="btn" type="button">再玩一次</button></div></div>`);
    root.append(card); $('button', card).onclick = start;
  };
  start();
}

/* ===================== 句子重組 ===================== */
function runTiles(root) {
  let order = shuffle(DATA.sentences.map((s, i) => i)), n = 0, score = 0;
  const render = () => {
    if (n >= order.length) {
      root.innerHTML = '';
      const c = h(`<div class="card done"><div class="muted">重組完成</div><div class="score">${score} / ${order.length}</div><p>一次就排對的題數</p>
        <div class="actions" style="justify-content:center"><button class="btn" type="button">再練一次</button></div></div>`);
      root.append(c); $('button', c).onclick = () => { order = shuffle(order); n = 0; score = 0; render(); }; return;
    }
    const s = DATA.sentences[order[n]], words = s.en.split(' ');
    let pool = shuffle(words.map((w, i) => ({ w, i })));
    if (pool.every((x, k) => x.i === k)) pool = pool.reverse();
    let ans = [], tries = 0;
    root.innerHTML = '';
    const card = h(`<div class="card">
      <div class="qhead"><span>點字卡排出英文句子</span><span>第 ${n + 1} / ${order.length} 題</span></div>
      <div class="bar"><i style="width:${(n / order.length) * 100}%"></i></div>
      <p class="prompt">${esc(s.zh)}</p>
      <p class="row-label">你的句子</p><div class="zone ans"></div>
      <p class="row-label" style="margin-top:14px">字卡</p><div class="zone pool"></div>
      <div class="slot"></div>
      <div class="actions"><button class="btn ghost" type="button" data-act="hint">提示下一個字</button><button class="btn" type="button" data-act="check">檢查</button><button class="btn" type="button" data-act="next" hidden>下一題</button></div></div>`);
    root.append(card);
    const zA = $('.ans', card), zP = $('.pool', card), slot = $('.slot', card);
    const draw = () => {
      zA.innerHTML = ans.map((x, k) => `<button class="wtile" type="button" data-a="${k}">${esc(x.w)}</button>`).join('');
      zP.innerHTML = pool.map((x, k) => `<button class="wtile" type="button" data-p="${k}">${esc(x.w)}</button>`).join('');
    };
    draw();
    zP.onclick = (e) => { const b = e.target.closest('[data-p]'); if (!b) return; ans.push(pool.splice(+b.dataset.p, 1)[0]); slot.innerHTML = ''; draw(); };
    zA.onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b || zA.classList.contains('ok')) return; pool.push(ans.splice(+b.dataset.a, 1)[0]); slot.innerHTML = ''; draw(); };
    $('[data-act="hint"]', card).onclick = () => {
      let k = 0; while (k < ans.length && ans[k].w === words[k]) k++;
      while (ans.length > k) pool.push(ans.pop());
      draw();
      const target = words[k]; const idx = pool.findIndex(x => x.w === target);
      if (idx >= 0) zP.querySelector(`[data-p="${idx}"]`).classList.add('hl');
      tries++;
    };
    $('[data-act="check"]', card).onclick = () => {
      if (pool.length) { slot.innerHTML = '<div class="fb no"><b>還有字卡沒用到。</b></div>'; return; }
      const ok = ans.map(x => x.w).join(' ') === s.en;
      if (ok) {
        if (tries === 0) score++;
        zA.classList.add('ok'); slot.innerHTML = `<div class="fb ok"><b>排對了！</b><span>${esc(s.en)}</span></div>`;
        $('[data-act="check"]', card).hidden = $('[data-act="hint"]', card).hidden = true;
        const nx = $('[data-act="next"]', card); nx.hidden = false; nx.focus(); nx.onclick = () => { n++; render(); }; speak(s.en);
      } else { tries++; slot.innerHTML = '<div class="fb no"><b>順序還不對。</b><span>點自己的句子可以把字卡放回去，或按「提示下一個字」。</span></div>'; }
    };
  };
  render();
}

/* ===================== 拼字 ===================== */
function runSpell(root, ids) {
  let order = shuffle(ids), n = 0, score = 0;
  const render = () => {
    if (n >= order.length) {
      root.innerHTML = '';
      const c = h(`<div class="card done"><div class="muted">拼字完成</div><div class="score">${score} / ${order.length}</div><p>沒看提示、第一次就拼對的題數</p>
        <div class="actions" style="justify-content:center"><button class="btn" type="button">再練一次</button></div></div>`);
      root.append(c); $('button', c).onclick = () => { order = shuffle(order); n = 0; score = 0; render(); }; return;
    }
    const i = order[n], [w, pos, zh, ex, exZh, form] = DATA.vocab[i];
    let shown = 1, tries = 0, helped = 0;
    const maxShown = Math.max(1, form.length - 2); // 至少留一個空格讓學生自己拼
    const hintStr = () => form.split('').map((c, k) => (k < shown || k === form.length - 1) ? c : '_').join('');
    root.innerHTML = '';
    const card = h(`<div class="card">
      <div class="qhead"><span>看首尾字母，拼出正確的字（注意字形變化）</span><span>第 ${n + 1} / ${order.length} 題</span></div>
      <div class="bar"><i style="width:${(n / order.length) * 100}%"></i></div>
      <p class="prompt">${esc(ex).replace(form, '______')}</p>
      <p class="muted" style="margin:0">${esc(exZh)}　｜　${esc(zh)}（${pos}）</p>
      <div class="letters" aria-label="字母提示">${hintStr()}</div>
      <label class="row-label" for="spell-in" style="display:block;margin-top:10px">輸入答案</label>
      <input id="spell-in" class="spell-in" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="slot"></div>
      <div class="actions"><button class="btn ghost" type="button" data-act="more">多一個字母</button><button class="btn" type="button" data-act="check">檢查</button><button class="btn" type="button" data-act="next" hidden>下一題</button></div></div>`);
    root.append(card);
    const more = $('[data-act="more"]', card);
    const syncMore = () => { more.disabled = shown >= maxShown; };
    more.onclick = () => { if (shown < maxShown) { shown++; helped++; $('.letters', card).textContent = hintStr(); } syncMore(); inp.focus({ preventScroll: true }); };
    syncMore();
    const inp = $('#spell-in', card), slot = $('.slot', card), chk = $('[data-act="check"]', card), nx = $('[data-act="next"]', card);
    const end = () => { chk.hidden = true; more.hidden = true; inp.disabled = true; nx.hidden = false; nx.focus(); nx.onclick = () => { n++; render(); }; };
    const check = () => {
      const v = inp.value.trim().toLowerCase(); if (!v) return;
      if (v === form.toLowerCase()) { if (tries === 0 && helped === 0) { score++; removeWrong(`v-${i}`); } slot.innerHTML = `<div class="fb ok"><b>拼對了！</b><span>${esc(ex)}</span></div>`; speak(form); end(); return; }
      tries++;
      if (tries < 2) { shown = Math.min(maxShown, shown + 2); $('.letters', card).textContent = hintStr(); syncMore(); slot.innerHTML = '<div class="fb no"><b>差一點。</b><span>多給你兩個字母，再試一次。</span></div>'; inp.select(); }
      else { addWrong(`v-${i}`); slot.innerHTML = `<div class="fb no"><b>正確答案是 ${esc(form)}</b><span>原形是 ${esc(w)}，記下來，等一下會再出現。</span></div>`; end(); }
    };
    chk.onclick = check; inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); nx.hidden ? check() : nx.click(); } };
    inp.focus({ preventScroll: true });
  };
  render();
}

}

function pageGrammar(main) {
  main.append(stepper([['learn', '1 看重點'], ['s1', '2 句型一練習'], ['s2', '3 句型二練習'], ['tiles', '4 句子重組']], ui.gstep, (s) => { ui.gstep = s; saveUi(); renderPage(); }));
  const area = h('<div class="stack"></div>'); main.append(area);
  if (ui.gstep === 'learn') {
    DATA.grammar.forEach(g => area.append(h(`<section class="card">
      <h3>${esc(g.title)}</h3>
      <div class="formula">${esc(g.formula)}</div>
      <ul>${g.rules.map(r => `<li>${r}</li>`).join('')}</ul>
      ${g.examples.map(([en, zh]) => `<div class="ex">${sayBtn(en)}<div><div class="en">${esc(en)}</div><div class="zh">${esc(zh)}</div></div></div>`).join('')}
    </section>`)));
  } else if (ui.gstep === 's1' || ui.gstep === 's2') {
    const set = ui.gstep === 's1' ? 0 : 1;
    runQuiz(area, () => shuffle(DATA.grammar[set].mcq.map((x, i) => grammarQ(set, i))), { id: ui.gstep });
  } else runTiles(area);
}

function pagePhrase(main) {
  main.append(stepper([['learn', '1 看片語'], ['quiz', '2 選擇題'], ['match', '3 配對']], ui.pstep, (s) => { ui.pstep = s; saveUi(); renderPage(); }));
  const area = h('<div class="stack"></div>'); main.append(area);
  if (ui.pstep === 'learn') {
    DATA.phrases.forEach((p, i) => area.append(h(`<section class="card">
      <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
        <h3><span style="font-family:var(--f-word)">${i + 1}. ${esc(p.p)}</span>　<span class="muted" style="font-size:17px">${esc(p.zh)}</span></h3>${sayBtn(p.p)}</div>
      <p style="margin:8px 0 0">${esc(p.note)}</p>
      <div class="ex">${sayBtn(p.ex)}<div><div class="en">${esc(p.ex)}</div><div class="zh">${esc(p.exZh)}</div></div></div>
    </section>`)));
  } else if (ui.pstep === 'quiz') runQuiz(area, () => shuffle(DATA.phraseQs.map((x, i) => phraseQ(i))), { id: 'phrase' });
  else runMatch(area, () => DATA.phrases.map((p, i) => ({ l: p.p, r: p.zh, speak: p.p, key: `p-${DATA.phraseQs.findIndex(q => q.pid === i)}` })), 5);
}

function pageVocab(main) {
  const groupBar = stepper([...DATA.groups.map((g, i) => [i, `${g}（${i * 5 + 1}–${i * 5 + 5}）`]), [-1, '全部 25 個']], ui.vgroup, (g) => { ui.vgroup = g; saveUi(); renderPage(); }, '選擇範圍');
  main.append(groupBar);
  main.append(stepper([['learn', '1 認識'], ['quiz', '2 選擇題'], ['match', '3 配對'], ['spell', '4 拼字']], ui.vstep, (s) => { ui.vstep = s; saveUi(); renderPage(); }));
  const ids = ui.vgroup < 0 ? DATA.vocab.map((v, i) => i) : [0, 1, 2, 3, 4].map(k => ui.vgroup * 5 + k);
  const area = h('<div class="stack"></div>'); main.append(area);
  if (ui.vstep === 'learn') {
    const grid = h('<div class="fgrid"></div>'); area.append(h('<p class="muted" style="margin:0">點卡片看中文和例句，再點一次蓋回去。</p>')); area.append(grid);
    ids.forEach(i => {
      const [w, pos, zh, ex, exZh] = DATA.vocab[i];
      const c = h(`<div class="flip" role="button" tabindex="0" aria-label="${esc(w)}">
        ${sayBtn(w, '朗讀 ' + w)}
        <div class="w">${esc(w)}</div><div class="pos">${esc(pos)}</div>
        <div class="back"><div class="zh">${esc(zh)}</div><div class="exs">${esc(ex)}</div><div class="exz">${esc(exZh)}</div></div>
        <div class="tap">點一下看意思</div></div>`);
      const toggle = () => { c.classList.toggle('open'); if (c.classList.contains('open')) speak(w); };
      c.onclick = (e) => { if (!e.target.closest('[data-say]')) toggle(); };
      c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
      grid.append(c);
    });
  } else if (ui.vstep === 'quiz') {
    runQuiz(area, () => {
      if (ids.length <= 5) return shuffle(ids.flatMap(i => [vocabQ(i, 'en'), vocabQ(i, 'cloze')]));
      return shuffle(ids.map(i => vocabQ(i, ['en', 'zh', 'cloze'][Math.floor(Math.random() * 3)])));
    }, { id: 'v' + ui.vgroup });
  } else if (ui.vstep === 'match') runMatch(area, () => ids.map(i => ({ l: DATA.vocab[i][0], r: DATA.vocab[i][2], speak: DATA.vocab[i][0], key: `v-${i}` })), 5);
  else runSpell(area, ids);
}

function describeKey(k) {
  let m;
  if ((m = k.match(/^g(\d)-(\d+)$/))) { const it = DATA.grammar[+m[1]].mcq[+m[2]]; return { tag: DATA.grammar[+m[1]].short, t: it.q.replace('______', `【${it.a}】`) }; }
  if ((m = k.match(/^p-(\d+)$/))) { const it = DATA.phraseQs[+m[1]]; return it ? { tag: '片語', t: it.q.replace('______', `【${it.a}】`) } : null; }
  if ((m = k.match(/^v-(\d+)$/))) { const v = DATA.vocab[+m[1]]; return { tag: '單字', t: `${v[0]}（${v[1]}）${v[2]}` }; }
  return null;
}

function pageWrong(main) {
  const keys = [...wrong].filter(k => describeKey(k));
  if (!keys.length) { main.append(h('<div class="card empty">錯題本是空的。<br>做練習時答錯的題目會自動收到這裡。</div>')); return; }
  const area = h('<div class="stack"></div>'); main.append(area);
  const showList = () => {
    area.innerHTML = '';
    const cur = [...wrong].filter(k => describeKey(k));
    if (!cur.length) { area.append(h('<div class="card empty">錯題都練完了！</div>')); return; }
    const card = h(`<div class="card"><h3>目前有 ${cur.length} 題要複習</h3>
      <p class="muted" style="margin:4px 0 0">在這裡答對的題目會從錯題本移除。</p>
      <div class="actions"><button class="btn" type="button" data-act="go">練習錯題</button><button class="btn ghost" type="button" data-act="clear">清空錯題本</button></div>
      <div class="wlist">${cur.map(k => { const d = describeKey(k); return `<div class="witem"><span class="t">${esc(d.t)}</span><span class="tag">${esc(d.tag)}</span></div>`; }).join('')}</div></div>`);
    area.append(card);
    $('[data-act="go"]', card).onclick = () => { area.innerHTML = ''; runQuiz(area, () => shuffle([...wrong].map(qFromKey).filter(Boolean)), { review: true }); };
    const clr = $('[data-act="clear"]', card);
    clr.onclick = () => {
      if (clr.dataset.confirm) { wrong.clear(); saveWrong(); renderPage(); return; }
      clr.dataset.confirm = '1'; clr.textContent = '再按一次確定清空';
    };
  };
  showList();
}

function updateBadge() {
  const b = document.getElementById('wbadge'); if (!b) return;
  const n = [...wrong].filter(k => describeKey(k)).length; b.textContent = n; b.hidden = n === 0;
}

function renderTabs() {
  const nav = $('#tabs'); nav.innerHTML = '';
  TABS.forEach(t => {
    const b = h(`<button type="button" role="tab" aria-selected="${t.id === ui.tab}">${t.name}${t.id === 'wrong' ? '<span class="badge" id="wbadge" hidden></span>' : ''}</button>`);
    b.onclick = () => { ui.tab = t.id; saveUi(); try { speechSynthesis.cancel(); } catch (e) {} renderTabs(); renderPage(); };
    nav.append(b);
  });
  updateBadge();
}
function renderPage() {
  const main = $('#main'); main.innerHTML = '';
  ({ grammar: pageGrammar, phrase: pagePhrase, vocab: pageVocab, wrong: pageWrong }[ui.tab] || pageGrammar)(main);
  updateBadge();
}

$('#picado').innerHTML = '<span class="flag"></span>'.repeat(16);
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
renderTabs(); renderPage();
</script>

</body>
</html>
